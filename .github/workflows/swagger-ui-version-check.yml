---
name: Update Swagger UI

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swagger-ui-update
  cancel-in-progress: false

jobs:
  update-swagger-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test updater
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Update Swagger UI
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          make update-swagger-ui
          if git diff --quiet -- embeddedswagger.go static/swagger-ui; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            version=$(sed -n 's/^[[:space:]]*SwaggerVersion = "\([^"]*\)".*/\1/p' embeddedswagger.go)
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.update.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Test update
        if: steps.update.outputs.changed == 'true'
        run: go test ./...

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.SWAGGER_UI_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automation/update-swagger-ui
          commit-message: "Update Swagger UI to ${{ steps.update.outputs.version }}"
          title: "Update Swagger UI to ${{ steps.update.outputs.version }}"
          body: |
            Update the embedded Swagger UI distribution and `SwaggerVersion` to ${{ steps.update.outputs.version }}.

            Upstream releases: https://github.com/swagger-api/swagger-ui/releases
          add-paths: |
            embeddedswagger.go
            static/swagger-ui
